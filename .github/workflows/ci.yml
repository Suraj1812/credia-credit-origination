name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Dufo.Credia.slnx
      - run: dotnet build Dufo.Credia.slnx -c Release --no-restore --warnaserror
      - run: dotnet test Dufo.Credia.slnx -c Release --no-build
